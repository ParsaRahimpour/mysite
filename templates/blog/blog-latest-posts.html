<div class="active-recent-blog-carusel">
    {% for post in posts %}
    <div class="single-recent-blog-post item">
        <div class="thumb">
            <img class="img-fluid" src="{{post.image.url}}" alt="{{post.title}}">
        </div>
        <div class="details">
            <div class="tags">
                <ul>
                    {% for category in post.category.all %}
                    <li>
                        <a href="{% url 'blog:category' cat_name=category.name %}">{{category.name}}</a>
                    </li>
                    {% endfor %}
                </ul>
            </div>
            <a href="{% url 'blog:single' post.id %}">
                <h4 class="title">{{post.title}}</h4>
            </a>
            <p>
                {{post.content|truncatewords:20}}
            </p>
            <h6 class="date">
                {{post.published_date|date:"d F, Y"}}
            </h6>
        </div>
    </div>
    {% endfor %}
</div>
